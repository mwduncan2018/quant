[project]
name = "options-proxy"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "protobuf>=7.35",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "yfinance>=0.2.60",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.82",
    "pytest>=9.1.1",
]
