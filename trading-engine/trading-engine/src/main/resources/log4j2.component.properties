log4j2.contextSelector=org.apache.logging.log4j.core.async.AsyncLoggerContextSelector
log4j2.asyncLoggerRingBufferSize=65536
log4j2.asyncLoggerWaitStrategy=Yield

# The queue-full policy was Discard with a threshold of INFO, which silently
# dropped INFO and below whenever the ring buffer filled. That happens during a
# callback burst -- an IBKR reconnect storm, a fast market -- which is precisely
# when the log is the only record of what the engine did. Default applies back
# pressure to the calling thread instead, so a busy moment slows logging rather
# than erasing it. These strategies are medium frequency by design, so the
# trade is worth taking; revisit only if a latency measurement says otherwise.
log4j2.asyncLoggerFullQueuePolicy=Default
