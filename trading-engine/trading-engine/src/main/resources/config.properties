LIVE_IBKR_DATA=false
SHOW_UI=false
STRATEGY_POLL_RATE_MS=16
ENTRY_ACKNOWLEDGEMENT_TIMEOUT_MS=10000
# Concurrent positions across ALL strategies, counting pending entries as well as
# open ones. This is the primary control on total leverage: each position risks
# 0.25% of net liquidation, and with a quarter-of-a-sigma stop that is roughly
# 0.25x net liquidation of notional apiece, so three slots sits near 0.75x.
MAX_ACTIVE_POSITIONS=3
STRATEGY_TWO_SIGMA_DOWNSIDE_UNIVERSE=AAPL,AMD,AMZN,AVGO,BABA,BAC,C,CAT,COST,CRM,CVX,DIS,GOOGL,GS,HOOD,INTC,JPM,META,MSFT,MU,NFLX,NVDA,PLTR,PYPL,SOFI,TSLA,UBER,UNH,V,XOM
STRATEGY_TWO_SIGMA_DOWNSIDE_REFERENCE_SYMBOLS=SPY

# Paper-only execution-verification strategy. Same universe as the two-sigma
# strategy; it needs no reference symbols because it reads no market index.
# MAX_ACTIVE_POSITIONS is global, so all three strategies compete for its slots.
STRATEGY_ONE_SIGMA_DOWNSIDE_UNIVERSE=AAPL,AMD,AMZN,AVGO,BABA,BAC,C,CAT,COST,CRM,CVX,DIS,GOOGL,GS,HOOD,INTC,JPM,META,MSFT,MU,NFLX,NVDA,PLTR,PYPL,SOFI,TSLA,UBER,UNH,V,XOM
STRATEGY_ONE_SIGMA_DOWNSIDE_REFERENCE_SYMBOLS=

# The short mirror. Same universe; also PAPER-only.
STRATEGY_ONE_SIGMA_UPSIDE_UNIVERSE=AAPL,AMD,AMZN,AVGO,BABA,BAC,C,CAT,COST,CRM,CVX,DIS,GOOGL,GS,HOOD,INTC,JPM,META,MSFT,MU,NFLX,NVDA,PLTR,PYPL,SOFI,TSLA,UBER,UNH,V,XOM
STRATEGY_ONE_SIGMA_UPSIDE_REFERENCE_SYMBOLS=
IBKR_HOST=127.0.0.1
IBKR_CLIENT_ID=0
IBKR_EXPECTED_ACCOUNT=
IBKR_RECONNECT_DELAY_MS=5000
# Override when LIVE and PAPER run from the same working directory.
# TRADING_STATE_PATH=data/trading-state-paper.json

# Python options proxy UDP/protobuf feed.
# The proxy defaults to sending IndicatorFrame datagrams to 127.0.0.1:5005.
OPTIONS_PROXY_ENABLED=true
OPTIONS_PROXY_BIND_HOST=127.0.0.1
OPTIONS_PROXY_UDP_PORT=5005
OPTIONS_PROXY_FRAME_MAX_AGE_MS=5000

# Maximum age of an aged IBKR market-data input before a strategy stops treating
# it as usable. It must exceed the slowest input's cadence: one-minute bars,
# which IBKR refreshes every few seconds while the minute forms but may pause
# during a quiet minute. Verify the real cadences during PAPER and tighten this.
# The previous close is exempt; IBKR sends it once, so it is session-scoped.
MARKET_DATA_MAX_AGE_MS=30000

# Options-proxy earnings endpoint. Earnings dates are pulled over HTTP rather
# than broadcast over UDP: the proxy fetches them once each morning and they are
# static for the session, so a request/response lifecycle fits where a 1 Hz
# stream would not. Point this at the proxy laptop's address when the engine
# runs on a different machine.
EARNINGS_ENABLED=true
EARNINGS_ENDPOINT_URL=http://127.0.0.1:8000/earnings
EARNINGS_CONNECT_TIMEOUT_MS=3000
EARNINGS_REQUEST_TIMEOUT_MS=5000
EARNINGS_RETRY_DELAY_MS=30000

# Options-proxy market-calendar endpoint. The session close drives both the
# entry cutoff and the time exit, so no clock time is encoded in the engine and
# an early-close day shortens the trading window on its own. Shares the earnings
# timeouts and retry delay; both are the same local service.
MARKET_CALENDAR_ENDPOINT_URL=http://127.0.0.1:8000/calendar
